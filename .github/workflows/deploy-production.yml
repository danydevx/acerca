name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare production directory
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.PRODUCTION_PATH }}'"

      - name: Deploy files
        run: |
          rsync -az --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="storage" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PRODUCTION_PATH }}/"

      - name: Prepare Laravel directories
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p bootstrap/cache

            chmod -R 775 storage
            chmod -R 775 bootstrap/cache

          EOF

      - name: Validate production environment
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            if [ ! -f .env ]; then
              echo "ERROR: Production .env does not exist"
              exit 1
            fi

            if ! grep -q "^APP_ENV=production" .env; then
              echo "ERROR: APP_ENV must be production"
              exit 1
            fi

            if ! grep -q "^APP_DEBUG=false" .env; then
              echo "ERROR: APP_DEBUG must be false"
              exit 1
            fi

            if ! grep -q "^DB_CONNECTION=mysql" .env; then
              echo "ERROR: DB_CONNECTION must be mysql"
              exit 1
            fi

            rm -f bootstrap/cache/config.php

            echo "Production environment OK"

          EOF

      - name: Install Composer dependencies
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            PHP="/opt/cpanel/ea-php83/root/usr/bin/php"
            COMPOSER="$(which composer)"

            $PHP $COMPOSER install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              --optimize-autoloader

          EOF

      - name: Verify database configuration
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            PHP="/opt/cpanel/ea-php83/root/usr/bin/php"

            rm -f bootstrap/cache/config.php

            DB_DRIVER=$(
              $PHP artisan tinker \
                --execute="echo config('database.default');" \
                2>/dev/null
            )

            echo "Database driver: ${DB_DRIVER}"

            if [ "${DB_DRIVER}" != "mysql" ]; then
              echo "ERROR: Laravel is not using MySQL"
              exit 1
            fi

            echo "MySQL configuration OK"

          EOF

      - name: Run Laravel production commands
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            PHP="/opt/cpanel/ea-php83/root/usr/bin/php"

            $PHP artisan optimize:clear

            $PHP artisan migrate --force

            $PHP artisan config:cache
            $PHP artisan route:cache

          EOF

      - name: Ensure storage link exists
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            PHP="/opt/cpanel/ea-php83/root/usr/bin/php"

            mkdir -p storage/app/public

            if [ ! -L public/storage ]; then
              $PHP artisan storage:link
            fi

          EOF

      - name: Verify production build
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.PRODUCTION_PATH }}"

            if [ ! -f public/build/manifest.json ]; then
              echo "ERROR: Vite manifest not found"
              exit 1
            fi

            echo "Production Vite build OK"

          EOF

      - name: Deployment completed
        run: |
          echo "Production deployment completed successfully"